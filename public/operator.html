<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workforce · Company verification</title><style>/* STYLE */ body{display:block}main{margin:0 auto;max-width:1000px;padding:32px 24px}</style></head><body><main><a href="/companies">← Company workspace</a><h1>Company verification</h1><p>Restricted operator workspace. Confirm the company exists and that this applicant is authorized, using a contact independently located on an official source. An email address or company name alone is insufficient.</p><div id="message" role="status"></div><div id="applications">Loading…</div></main><script type="module">
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[],currentCursor=null,back=[];
async function load(cursor=currentCursor){currentCursor=cursor;const r=await fetch('/api/intake/operator/companies'+(cursor?'?before='+encodeURIComponent(cursor):''),{cache:'no-store'}),j=await r.json();if(!r.ok){document.querySelector('#applications').innerHTML=r.status===401?'<a class="button" href="/signin-with-chatgpt?return_to=%2Foperator">Sign in as site operator</a>':'<p>Only the designated site operator can open company applications.</p>';return;}rows=j.applications;document.querySelector('#applications').innerHTML=rows.map(c=>`<section class="card"><h2>${esc(c.name)} · ${esc(c.verification_status)}</h2><p><strong>Authenticated applicant: ${esc(c.applicant_email||'Owner must resubmit while signed in')}</strong><br>Account reference: ${esc(c.owner_id)}<br>Company contact supplied by applicant: ${esc(c.application.contact_email||'Not provided')}<br>Website supplied by applicant: ${esc(c.application.website||'Not provided')}</p><p>Claimed authority: ${esc(c.application.authority||'Not provided')}</p><p class="help">Previous decision: ${esc(c.verification.note||'None')}</p><form data-id="${c.id}"><label>Decision<select name="status"><option value="approved">Approve after verification</option><option value="rejected">Request a corrected application</option><option value="suspended">Suspend company operations</option></select></label><label class="check"><input type="checkbox" name="company_confirmed">I independently confirmed the legal company exists.</label><label class="check"><input type="checkbox" name="authority_confirmed">I confirmed that the authenticated applicant shown above is authorized to manage this company.</label><label>Evidence and decision note<textarea name="note" minlength="30" maxlength="1000" required placeholder="Record the official source, verification method, date and authority confirmation. Do not paste identity documents or secrets."></textarea></label><button>Record decision</button></form></section>`).join('')||'<p>No applications yet.</p>';document.querySelector('#applications').insertAdjacentHTML('beforeend',`<div class="actions">${back.length?'<button id="previous-applications">← Newer applications</button>':''}${j.next_cursor?'<button id="next-applications">Older applications →</button>':''}</div>`);document.querySelector('#next-applications')?.addEventListener('click',()=>{back.push(currentCursor);load(j.next_cursor);});document.querySelector('#previous-applications')?.addEventListener('click',()=>load(back.pop()));document.querySelectorAll('form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const c=rows.find(x=>x.id===f.dataset.id),b=Object.fromEntries(new FormData(f));b.company_confirmed=f.elements.company_confirmed.checked;b.authority_confirmed=f.elements.authority_confirmed.checked;b.revision=c.revision;f.querySelector('button').disabled=true;try{const r=await fetch('/api/intake/operator/companies/'+c.id,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.code);document.querySelector('#message').textContent='Decision recorded.';await load();}catch(e){document.querySelector('#message').textContent='Not saved: '+e.message;f.querySelector('button').disabled=false;}});}
load().catch(()=>document.querySelector('#message').textContent='Could not load applications. Refresh to retry.');
</script></body></html>
